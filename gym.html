<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AZ-900 Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EAED;--surface:#FFFFFF;--ink:#16191D;--muted:#5C6570;--line:#C9CED4;
  --d1:#2E8B57;--d2:#1E5AA8;--d3:#E0A800;--ex:#D7263D;
  --ok:#2E8B57;--bad:#D7263D;--okbg:#E3F3EA;--badbg:#FBE5E8;--tipbg:#F1F3F5;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#1C2026;--surface:#262B33;--ink:#EEF1F4;--muted:#9AA4B0;--line:#3A414B;--okbg:#1E3A2B;--badbg:#45222A;--tipbg:#20252C}
}
:root[data-theme="dark"]{--bg:#1C2026;--surface:#262B33;--ink:#EEF1F4;--muted:#9AA4B0;--line:#3A414B;--okbg:#1E3A2B;--badbg:#45222A;--tipbg:#20252C}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 Barlow,"Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 48px}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-weight:800;line-height:1.08;letter-spacing:.005em}
h2{font-size:28px;margin:22px 0 10px}
h3{font-size:22px;margin:0 0 2px}
p{margin:0 0 10px}
button{font:inherit;color:inherit}
.btn{font:600 16px/1.2 Barlow,system-ui,sans-serif;min-height:44px;padding:10px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghost{background:transparent;border-color:transparent;padding-left:4px;padding-right:4px}
.btn.small{font-size:15px;min-height:40px}
.btn.wide{width:100%;margin-top:12px}
button:focus-visible,input:focus-visible{outline:3px solid var(--d2);outline-offset:2px}

/* hero */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 14px 16px;text-align:center}
.hero svg{width:100%;max-width:380px;height:auto;display:block;margin:0 auto}
.kg{font-size:68px;margin:4px 0 0;font-variant-numeric:tabular-nums}
.lv{font-weight:600;margin:2px 0 4px}
.streak{color:var(--muted);margin:0}
.intro{color:var(--muted);margin:14px 2px 0}

/* stations */
.stations{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.st{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:16px 14px}
.st+.st{border-top:1px solid var(--line)}
.plate{width:64px;height:64px;border-radius:50%;background:var(--c);display:grid;place-items:center;box-shadow:inset 0 0 0 5px rgba(0,0,0,.16),inset 0 0 0 7px rgba(255,255,255,.18);color:var(--pc,#fff);font:800 15px/1 "Barlow Condensed",sans-serif;text-align:center}
.meta{color:var(--muted);font-size:15px;margin:0 0 10px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts .btn{padding:8px 12px;min-height:40px;font-size:15px}

.exam{background:var(--ex);color:#fff;border-radius:18px;padding:18px 16px;margin-top:18px}
.exam h2{margin:0 0 6px;color:#fff}
.exam p{color:#FFE3E6}
.exam .btn{background:#fff;color:var(--ex);border-color:#fff;margin-top:4px}
.foot{text-align:center;margin-top:24px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:15px;min-height:40px}

/* shared views */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.count{color:var(--muted);font-weight:600;font-size:15px;display:flex;gap:10px;align-items:center}
.timer{background:var(--ex);color:#fff;border-radius:8px;padding:2px 8px;font-variant-numeric:tabular-nums}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.prog div{height:100%;background:var(--c);transition:width .3s}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.row .btn{flex:1 1 auto}

.lesson{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 16px}
.lesson h2{margin:0 0 10px;font-size:32px}
.lesson .body p{margin-bottom:12px}
.lesson ul{margin:0 0 12px;padding-left:20px}
.lesson li{margin-bottom:4px}
.tip{background:var(--tipbg);border-left:5px solid var(--c);border-radius:0 10px 10px 0;padding:10px 12px;margin-top:6px}
.auto{display:flex;gap:10px;align-items:flex-start;margin-top:16px;color:var(--muted);font-size:15px;cursor:pointer}
.auto input{width:22px;height:22px;margin-top:1px;accent-color:var(--c,var(--d2));flex:none}

.qwrap .q{font-size:26px;margin:4px 0 14px;font-weight:600;line-height:1.15}
.tag{color:var(--muted);font-size:15px;margin:0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;min-height:52px;font-size:17px}
.opt:disabled{cursor:default}
.let{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--tipbg);font:800 16px/1 "Barlow Condensed",sans-serif}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.right .let{background:var(--ok);color:#fff}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.opt.wrong .let{background:var(--bad);color:#fff}
.opt.picked{border-color:var(--ink)}
.fb{border-radius:12px;padding:12px 14px;margin-top:14px}
.fb.ok{background:var(--okbg)}
.fb.no{background:var(--badbg)}
.fbh{font-weight:600;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gain{background:var(--ok);color:#fff;border-radius:8px;padding:1px 8px;font:800 17px/1.4 "Barlow Condensed",sans-serif;animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}

.result{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 16px;text-align:center}
.result h2{margin:6px 0 8px}
.big{font-size:84px;margin:0;line-height:1;color:var(--c)}
.review{margin-top:18px}
.rv{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.rv .q2{font-weight:600;margin-bottom:6px}
.rv .you{color:var(--bad)}
.rv .corr{color:var(--ok);font-weight:600}
.rv .ex{color:var(--muted);font-size:15px;margin:4px 0 0}

.fc{width:100%;min-height:240px;background:var(--surface);border:1.5px solid var(--line);border-top:8px solid var(--c);border-radius:18px;padding:22px 18px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;text-align:center;cursor:pointer}
.fc .term{font-size:34px}
.fc .term-sm{font:800 20px/1.1 "Barlow Condensed",sans-serif;color:var(--muted)}
.fc .def{font-size:19px;line-height:1.45}
.fc .hint{color:var(--muted);font-size:15px}
.fc.flipped{animation:flip .35s ease-out}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
/* fun extras */
.hero{position:relative}
.snd{position:absolute;top:6px;right:6px;min-height:44px;min-width:44px;border:0;background:transparent;font-size:22px;cursor:pointer;border-radius:10px}
.coach{display:flex;gap:12px;align-items:flex-start;margin:16px 0 0;background:none;border:0;padding:0;text-align:left;cursor:pointer;width:100%}
.coach .av{flex:none;width:52px;height:52px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line);display:grid;place-items:center;font-size:28px}
.coach .bub{background:var(--surface);border:1.5px solid var(--line);border-radius:4px 14px 14px 14px;padding:10px 12px;font-size:16px;flex:1}
.coach .who{display:block;font-weight:600;font-size:14px;color:var(--muted)}
.sprint{background:var(--d2);color:#fff;border-radius:18px;padding:18px 16px;margin-top:18px}
.sprint h2{margin:0 0 6px;color:#fff}.sprint p{color:#DCE7F7}
.sprint .btn{background:#fff;color:var(--d2);border-color:#fff;margin-top:4px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.bd{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;font-size:14px;line-height:1.25;font-weight:600}
.bd .ic{font-size:30px;display:block;margin-bottom:4px}
.bd small{display:block;color:var(--muted);margin-top:3px;font-weight:400}
.bd.locked{opacity:.5}.bd.locked .ic{filter:grayscale(1)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.cf{position:fixed;top:-24px;width:12px;height:22px;border-radius:3px;z-index:50;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
.lvl{position:fixed;inset:0;background:rgba(10,12,16,.6);display:grid;place-items:center;z-index:55;padding:20px;cursor:pointer}
.lvl .box{background:var(--surface);color:var(--ink);border-radius:20px;padding:26px 22px;text-align:center;max-width:340px;animation:pop .5s ease-out}
.lvl .big{color:var(--ex);font-size:56px}
.sp-time{font:800 56px/1 "Barlow Condensed",sans-serif;text-align:center;color:var(--d2);font-variant-numeric:tabular-nums;margin:0 0 4px}
.sp-time.hot{color:var(--ex)}
.sp-score{text-align:center;color:var(--muted);font-weight:600;margin-bottom:10px}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.vxhead{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--ink);color:var(--bg);padding:10px 12px;border-radius:12px;font-weight:600;font-size:15px;margin-bottom:12px}
.vx{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.rq{font:600 20px/1.35 Barlow,system-ui,sans-serif;margin:0 0 14px}
.ropt{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;font-size:17px}
.ropt input,.ync input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--d2)}
.warn{background:var(--badbg);border-radius:8px;padding:8px 10px;font-size:15px}
.yn{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ynh,.ynr{display:grid;grid-template-columns:1fr 50px 50px;align-items:center;gap:4px}
.ynh{background:var(--tipbg);font-weight:600;font-size:14px;padding:8px 10px}
.ynh span:not(:first-child){text-align:center}
.ynr{padding:8px 10px;border-top:1px solid var(--line);font-size:16px}
.ync{display:flex;justify-content:center;align-items:center;min-height:44px;cursor:pointer}
.mt{display:grid;gap:14px}.mtr{display:grid;gap:6px;font-size:16px}
select{font:500 16px Barlow,system-ui,sans-serif;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-height:44px;max-width:100%}
.ddp{font-size:18px;line-height:2.1;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
.rv-b{min-height:44px;border-radius:10px;border:1.5px dashed var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:600;font-size:15px}
.rv-b.done{border-style:solid;border-color:var(--ok)}.rv-b.mk{background:var(--tipbg)}
.exam .btn.alt{background:transparent;color:#fff;border-color:rgba(255,255,255,.75)}
.exam .acts{margin-top:6px}
.term{font:inherit;font-weight:700;background:none;border:0;padding:0;color:inherit;border-bottom:2.5px dotted var(--c);cursor:pointer;line-height:inherit}
.hint2{color:var(--muted);font-size:14px;margin:12px 0 0}
.fsz{float:right;display:flex;gap:6px;margin:-4px -4px 6px 10px}
.fsz button{min-width:44px;min-height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:700 16px Barlow,system-ui,sans-serif;cursor:pointer}
.qc{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;padding:14px 14px 16px;margin-top:16px}
.qc h3{margin:0 0 6px}.qcq{font-weight:600;font-size:18px;line-height:1.35}
.sheet{position:fixed;inset:0;z-index:58;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,12,16,.35);padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));cursor:pointer}
.sbox{background:var(--surface);color:var(--ink);border-radius:18px;padding:16px 18px;max-width:520px;width:100%;animation:pop .3s ease-out;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.sbox b{font-size:26px;display:block;margin-bottom:4px}.sbox small{color:var(--muted)}
.lmap{list-style:none;padding:0;margin:18px 0 0;position:relative}
.lmap::before{content:"";position:absolute;left:25px;top:24px;bottom:24px;width:4px;background:var(--line);border-radius:2px}
.lm{display:flex;gap:14px;align-items:center;width:100%;background:none;border:0;padding:8px 0;text-align:left;cursor:pointer;color:var(--ink);font:inherit}
.lmn{position:relative;z-index:1;flex:none;width:54px;height:54px;border-radius:50%;background:var(--surface);border:3px solid var(--line);display:grid;place-items:center;font:800 20px/1 "Barlow Condensed",sans-serif}
.lm.done .lmn{background:var(--c);border-color:var(--c);color:var(--pc)}
.lm.nx .lmn{border-color:var(--c);animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(30,90,168,.45)}100%{box-shadow:0 0 0 12px rgba(30,90,168,0)}}
.lmt{font-weight:600;font-size:17px;line-height:1.25}.lmt small{display:block;color:var(--muted);font-weight:400;font-size:14px;margin-top:2px}
.syl{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;cursor:pointer;font-size:16px}
.syl+.syl{border-top:1px solid var(--line)}
.syl input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--d1)}
.ready{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px 6px;margin-top:16px}
.ready h2{margin:0;font-size:24px}
.rtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rpct{font-size:44px}
.rrow{display:flex;justify-content:space-between;font-size:15px;font-weight:600;margin-bottom:4px}
.ready .prog{margin-bottom:10px}
.boss{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:14px}
.bname{display:flex;gap:10px;align-items:center;flex:1}
.drag{font-size:40px;display:inline-block}
.drag.hit{animation:shake .35s}
.hp{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:4px 0 2px;min-width:110px}
.hp div{height:100%;background:var(--ex);transition:width .4s}
.boss small{color:var(--muted)}
.hearts{font-size:20px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
const D={
d1:{name:"Cloud-koncepter",pct:"25–30%",color:"var(--d1)",pc:"#fff",
lessons:[
["Hvad er cloud?","<p><b>Cloud computing</b> betyder, at du får IT-tjenester som servere, lagring, databaser, netværk og software leveret over internettet.</p><p>Du lejer i stedet for at eje. Microsoft bygger og driver datacentrene, og du bruger det, du har brug for.</p>","Hjemmegym eller fitnessmedlemskab? Hjemmegymmet er dyrt fra start, og du reparerer selv maskinerne. Medlemskabet betaler du løbende for – det er cloud."],
["Shared responsibility","<p>Ansvaret deles mellem Microsoft og dig. Hvor stor en del hver har, afhænger af servicetypen.</p><ul><li><b>Altid Microsofts:</b> det fysiske datacenter, det fysiske netværk og de fysiske servere.</li><li><b>Altid dit:</b> dine data, dine enheder, dine konti og identiteter.</li><li>Jo mere du går fra IaaS mod SaaS, jo mere overtager Microsoft.</li></ul>","Fitnesscentret sørger for bygningen og maskinerne. Men om du låser dit skab – det er dit eget ansvar. Det samme gælder dine data."],
["Public, private og hybrid","<ul><li><b>Public cloud:</b> ejet af udbyderen og delt med mange kunder. Ingen store investeringer på forhånd.</li><li><b>Private cloud:</b> bruges af én organisation. Fuld kontrol, men du betaler for hardwaren.</li><li><b>Hybrid cloud:</b> en kombination af public og private.</li><li><b>Multi-cloud:</b> flere cloud-udbydere på én gang.</li></ul><p><b>Azure Arc</b> lader dig styre servere uden for Azure (on-prem og andre clouds) fra Azure. <b>Azure VMware Solution</b> kører dine VMware-maskiner i Azure.</p>","Public = offentligt fitnesscenter. Private = dit eget privatgym. Hybrid = du træner hjemme om morgenen og i centret om aftenen."],
["CapEx vs. OpEx","<p><b>CapEx</b> (capital expenditure) er en stor engangsinvestering i fysisk udstyr, fx servere og datacentre.</p><p><b>OpEx</b> (operational expenditure) er løbende betaling for services. Cloud er OpEx.</p><p>Azure bruger en <b>consumption-based model</b>: du betaler kun for det, du bruger, og der er ingen udgifter på forhånd (pay-as-you-go).</p>","CapEx = du køber hele hjemmegymmet. OpEx = du betaler et månedligt medlemskab og kan opsige det når som helst."],
["Tilgængelighed og skalering","<ul><li><b>High availability:</b> tjenesten er tilgængelig, selv når noget går galt. En <b>SLA</b> (service-level agreement) angiver den garanterede oppetid, fx 99,9 %.</li><li><b>Scalability:</b> du kan justere kapaciteten efter behov.</li><li><b>Vertical scaling (scale up):</b> mere CPU eller RAM til den samme maskine.</li><li><b>Horizontal scaling (scale out):</b> flere maskiner.</li><li><b>Elasticity:</b> skalering sker automatisk efter belastningen.</li></ul>","Scale up = tungere vægte på den samme stang. Scale out = flere stænger. Elasticity = centret åbner automatisk ekstra hold i januar."],
["Pålidelighed og forudsigelighed","<p><b>Reliability:</b> systemet kan komme sig efter fejl og fortsætte med at fungere. Azure hjælper med et decentralt design på tværs af regioner.</p><p><b>Predictability:</b> du kan forudsige både <b>performance</b> (fx med autoscaling og load balancing) og <b>omkostninger</b> (du kan spore og forudsige forbruget).</p>","Et godt træningsprogram er forudsigeligt: du ved, hvad det koster af tid, og hvad du får ud af det."],
["Sikkerhed, governance og administration","<ul><li><b>Governance:</b> skabeloner og politikker sikrer, at du overholder regler og standarder.</li><li><b>Security:</b> du vælger selv kontrolniveauet. Med IaaS styrer du mere selv, og med PaaS og SaaS patcher Microsoft for dig. Azure har også DDoS-beskyttelse.</li><li><b>Management of the cloud:</b> autoscaling, skabeloner, overvågning og alarmer.</li><li><b>Management in the cloud:</b> du styrer det hele via portal, CLI, API'er eller PowerShell.</li></ul>","Governance er fitnesscentrets husregler. Alle skal overholde dem, uanset hvem der træner."],
["IaaS, PaaS og SaaS","<ul><li><b>IaaS:</b> mest kontrol. Du lejer infrastruktur som virtuelle maskiner. Godt til <i>lift-and-shift</i>-migrering samt test og udvikling.</li><li><b>PaaS:</b> platformen er klar, og du bygger bare din app. Eksempler er App Service og Azure SQL Database.</li><li><b>SaaS:</b> færdig software, du bare bruger. Eksempler er Microsoft 365 og Outlook.</li></ul>","IaaS = du lejer en tom hal og bringer selv udstyret. PaaS = maskinerne står klar, og du træner. SaaS = holdtræning: du møder bare op."],
["Serverless","<p>Med <b>serverless</b> tænker du slet ikke på servere. Koden kører, når en hændelse sker, og du betaler kun for den tid, den kører.</p><p>Eksempler er <b>Azure Functions</b> og <b>Logic Apps</b>. Serverless regnes typisk som en form for PaaS.</p>","Serverless er som et klippekort: du betaler kun, når du rent faktisk træner."]
],
quiz:[
["En virksomhed vil undgå store investeringer i hardware på forhånd. Hvilken udgiftstype giver cloud?",["CapEx","OpEx","Afskrivning","Fast årlig licens"],1,"Cloud er OpEx: du betaler løbende for det, du bruger, i stedet for en stor investering på forhånd."],

d2:{name:"Arkitektur og services",pct:"35–40%",color:"var(--d2)",pc:"#fff",
lessons:[
["Hierarkiet i Azure","<p>Fra størst til mindst:</p><ul><li><b>Management groups:</b> samler subscriptions, så du kan styre politikker og adgang på tværs.</li><li><b>Subscriptions:</b> en grænse for fakturering og adgang. Brug fx én til udvikling og én til produktion.</li><li><b>Resource groups:</b> logiske containere til ressourcer. En ressource kan kun ligge i én gruppe, og grupper kan ikke ligge i hinanden.</li><li><b>Resources:</b> VM'er, databaser, storage osv.</li></ul><p>Sletter du en resource group, slettes alt i den!</p>","Tænk på en fitnesskæde: kæden (management group), det enkelte center (subscription), rummene (resource groups) og maskinerne (resources)."],
["Regioner","<p>En <b>region</b> er et geografisk område med ét eller flere datacentre, forbundet med et netværk med lav forsinkelse.</p><p><b>Region pairs:</b> de fleste regioner er parret med en anden region i samme geografi. Opdateringer rulles ud til én ad gangen, og ved et stort nedbrud prioriteres gendannelse af én region i hvert par.</p><p><b>Sovereign regions</b> er isolerede udgaver af Azure, fx Azure Government (USA) og Azure i Kina, som drives af 21Vianet.</p>","Vælg en region tæt på dine brugere – ligesom du vælger det fitnesscenter, der ligger tættest på dig."],
["Availability zones","<p><b>Availability zones</b> er fysisk adskilte datacentre inden for én region. Hver zone har egen strøm, køling og netværk.</p><p>Regioner, der understøtter zoner, har <b>mindst tre</b>. Hvis én zone går ned, kører de andre videre.</p><ul><li><b>Zonal services:</b> du placerer ressourcen i en bestemt zone (fx en VM).</li><li><b>Zone-redundant services:</b> Azure kopierer automatisk på tværs af zoner.</li></ul>","Tre omklædningsrum med hver deres bruser. Går vandet i det ene, kan du stadig komme i bad."],
["Compute: virtuelle maskiner","<ul><li><b>Virtual machines (VM):</b> IaaS med fuld kontrol over OS.</li><li><b>VM Scale Sets:</b> mange ens VM'er med automatisk skalering og load balancing.</li><li><b>Availability sets:</b> spreder VM'er over <b>fault domains</b> (forskellig strøm og netværk) og <b>update domains</b> (opdateres ikke samtidig).</li><li><b>Azure Virtual Desktop:</b> Windows-skrivebord og apps fra skyen.</li></ul>","Fault domains: stil ikke alle løbebånd på samme stikkontakt. Update domains: service én maskine ad gangen, så resten kan bruges."],
["Containers, Functions og App Service","<ul><li><b>Containers</b> er letvægtsmiljøer, der deler værtens OS og starter hurtigt.</li><li><b>Azure Container Instances (ACI):</b> den nemmeste måde at køre en container på, uden at styre servere.</li><li><b>Azure Container Apps:</b> containere med ekstra funktioner som autoskalering og load balancing.</li><li><b>Azure Kubernetes Service (AKS):</b> orkestrering af mange containere.</li><li><b>Azure Functions:</b> serverless kode, der kører på hændelser.</li><li><b>App Service:</b> PaaS-hosting af webapps, API'er og mobil-backends.</li></ul>","En VM er en hel lejlighed. En container er et værelse i et bofællesskab: hurtigere at flytte ind i, men I deler køkkenet (OS'et)."],
["Netværk","<ul><li><b>Virtual Network (VNet):</b> dit private netværk i Azure, delt op i subnets.</li><li><b>VNet peering:</b> forbinder to VNets, også på tværs af regioner.</li><li><b>VPN Gateway:</b> krypteret forbindelse til on-prem over internettet.</li><li><b>ExpressRoute:</b> privat forbindelse, der <b>ikke</b> går over det offentlige internet.</li><li><b>Azure DNS:</b> host dine DNS-domæner i Azure.</li><li><b>Public endpoint</b> har en offentlig IP. <b>Private endpoint</b> giver en privat IP i dit VNet.</li></ul>","VPN er en tunnel under en offentlig vej. ExpressRoute er din helt egen privatvej."],
["Storage-typer","<p>En <b>storage account</b> har et navn, der skal være unikt i hele verden, og samler dine data services:</p><ul><li><b>Blob:</b> ustruktureret data som billeder, video og backup.</li><li><b>Azure Files:</b> fildelinger via SMB eller NFS.</li><li><b>Queue:</b> beskeder mellem app-komponenter.</li><li><b>Table:</b> NoSQL-data med nøgle og værdi.</li><li><b>Disk storage:</b> diske til VM'er.</li></ul>","Blob er dit store sportstaskerum: alt kan ligge der, uanset form."],
["Redundans","<ul><li><b>LRS:</b> tre kopier i ét datacenter.</li><li><b>ZRS:</b> tre kopier fordelt på tre availability zones.</li><li><b>GRS:</b> LRS i din region + en kopi i en sekundær region.</li><li><b>GZRS:</b> ZRS i din region + en kopi i en sekundær region.</li><li><b>RA-GRS / RA-GZRS:</b> som ovenfor, men du kan også <b>læse</b> fra den sekundære region.</li></ul>","L = lokal, Z = zoner, G = geografisk. Jo flere bogstaver, jo mere sikker – og dyrere."],
["Access tiers","<ul><li><b>Hot:</b> data, du bruger ofte.</li><li><b>Cool:</b> sjældent brugt, gemmes mindst 30 dage.</li><li><b>Cold:</b> meget sjældent brugt, mindst 90 dage.</li><li><b>Archive:</b> næsten aldrig brugt, mindst 180 dage. Data er offline og skal <b>rehydreres</b> (kan tage timer) før brug.</li></ul><p>Jo koldere, jo billigere at gemme – men dyrere at hente.</p>","Hot = drikkedunken i hånden. Archive = vinterjakken på loftet."],
["Flyt og migrér data","<ul><li><b>AzCopy:</b> kommandolinjeværktøj til at kopiere data.</li><li><b>Azure Storage Explorer:</b> app med grafisk brugerflade til dine storage-data.</li><li><b>Azure File Sync:</b> synkroniserer en Windows-filserver med Azure Files.</li><li><b>Azure Migrate:</b> samlet hub til at flytte servere, databaser og webapps til Azure.</li><li><b>Azure Data Box:</b> en fysisk boks, der sendes med post, når der er for meget data til nettet.</li></ul>","Data Box er flyttebilen. Når der er for meget til at bære, kører man det hele på én gang."],
["Identitet: Microsoft Entra ID","<p><b>Microsoft Entra ID</b> (tidligere Azure AD) er Azures cloud-baserede identitets- og adgangsstyring.</p><ul><li><b>Authentication:</b> hvem er du? <b>Authorization:</b> hvad må du?</li><li><b>SSO:</b> ét login til mange apps.</li><li><b>MFA:</b> to eller flere beviser – noget du ved, har eller er.</li><li><b>Passwordless:</b> Windows Hello, Authenticator-app eller FIDO2-nøgle.</li><li><b>Microsoft Entra Connect:</b> synkroniserer on-prem Active Directory med Entra ID.</li><li><b>Microsoft Entra Domain Services:</b> administrerede domænetjenester (domain join, group policy, LDAP, Kerberos) uden at du selv skal køre domain controllers.</li><li><b>External identities:</b> B2B til partnere og B2C til kunder.</li></ul>","Authentication er dit medlemskort i døren. Authorization er, om kortet giver adgang til spaen."],
["Adgang og sikkerhed","<ul><li><b>Conditional Access:</b> hvis-så-regler baseret på bruger, lokation og enhed. Fx: login fra udlandet → kræv MFA.</li><li><b>Azure RBAC:</b> roller tildeles på et scope og <b>nedarves</b> nedad. Giv kun den adgang, der er brug for (least privilege).</li><li><b>Zero Trust:</b> verificér altid, giv mindst mulig adgang, og antag, at du allerede er kompromitteret.</li><li><b>Defense in depth:</b> sikkerhed i lag – fysisk, identitet, perimeter, netværk, compute, applikation og data.</li><li><b>Microsoft Defender for Cloud:</b> overvåger sikkerheden og giver anbefalinger, også for hybrid og multi-cloud.</li></ul>","Defense in depth er som et fitnesscenter med dørkort, reception, låste skabe og kamera. Kommer en forbi ét lag, er der stadig flere."]
],

d3:{name:"Styring og governance",pct:"30–35%",color:"var(--d3)",pc:"#16191D",
lessons:[
["Hvad påvirker prisen?","<ul><li><b>Ressourcetype og forbrug:</b> større og flere ressourcer koster mere.</li><li><b>Region:</b> samme service kan koste forskelligt i forskellige regioner.</li><li><b>Netværkstrafik:</b> data <b>ind</b> i Azure (ingress) er typisk gratis. Data <b>ud</b> (egress) koster.</li><li><b>Subscription-type</b> og køb via <b>Azure Marketplace</b>.</li></ul><p>Spar penge med <b>Reserved Instances</b> (bind dig i 1 eller 3 år) og <b>Azure Hybrid Benefit</b> (genbrug eksisterende Windows Server- og SQL-licenser).</p>","Reserved Instances er årskortet: billigere per gang, fordi du binder dig."],
["Værktøjer til omkostninger","<ul><li><b>Pricing calculator:</b> estimér prisen på de services, du planlægger at bruge.</li><li><b>Microsoft Cost Management:</b> se dit faktiske forbrug, sæt budgetter og få alarmer.</li><li><b>Tags:</b> navn/værdi-par (fx Afdeling=Salg), der organiserer ressourcer og gør omkostninger nemme at fordele. Tags nedarves ikke automatisk.</li></ul>","Pricing calculator = du regner på, hvad et nyt træningsprogram koster. Cost Management = du tjekker kontoudtoget bagefter."],
["Azure Policy","<p><b>Azure Policy</b> laver regler for, hvordan dine ressourcer må se ud. Fx: ressourcer må kun oprettes i EU-regioner, eller alle ressourcer skal have et tag.</p><p>Policy kan tjekke, om eksisterende ressourcer overholder reglerne, og i nogle tilfælde rette dem automatisk. Flere policies samlet kaldes et <b>initiative</b>.</p><p><b>Husk forskellen:</b> RBAC styrer <i>hvem</i> der må gøre hvad. Policy styrer <i>hvordan</i> ressourcerne må være.</p>","RBAC er dørkortet (hvem må komme ind). Policy er husreglerne (fx indendørssko påkrævet)."],
["Resource locks og Purview","<p><b>Resource locks</b> forhindrer uheld:</p><ul><li><b>Delete (CanNotDelete):</b> du kan læse og ændre, men ikke slette.</li><li><b>ReadOnly:</b> du kan kun læse.</li></ul><p>Låse gælder også for ejere – de skal fjerne låsen først.</p><p><b>Microsoft Purview</b> er til data governance, risiko og compliance. Den kortlægger og klassificerer data på tværs af on-prem, multi-cloud og SaaS.</p>","En lås på skabet: selv du må låse op, før du kan tømme det."],
["Værktøjer til at styre Azure","<ul><li><b>Azure portal:</b> webbaseret brugerflade.</li><li><b>Azure Cloud Shell:</b> Bash eller PowerShell direkte i browseren.</li><li><b>Azure CLI</b> og <b>Azure PowerShell:</b> styr Azure via kommandoer.</li><li><b>Azure Arc:</b> styr ressourcer uden for Azure.</li><li><b>Azure Resource Manager (ARM):</b> laget, som alle forespørgsler til Azure går igennem.</li><li><b>ARM templates (JSON)</b> og <b>Bicep:</b> Infrastructure as Code. Du beskriver, hvad du vil have, og Azure bygger det.</li></ul>","Infrastructure as Code er dit træningsprogram på papir: det samme resultat hver gang, du følger det."],
["Azure Advisor","<p><b>Azure Advisor</b> er en gratis tjeneste, der analyserer dine ressourcer og giver personlige anbefalinger i fem kategorier:</p><ul><li>Reliability</li><li>Security</li><li>Performance</li><li>Operational excellence</li><li>Cost</li></ul>","Advisor er din personlige træner, der siger: »Du kan spare penge her, og den øvelse laver du forkert.«"],
["Azure Service Health","<p>Service Health har tre niveauer:</p><ul><li><b>Azure status:</b> det globale overblik over alle regioner.</li><li><b>Service Health:</b> de services og regioner, <i>du</i> bruger, inkl. planlagt vedligehold og hændelser.</li><li><b>Resource Health:</b> en <i>specifik</i> ressource, fx din VM.</li></ul>","Azure status = vejrudsigten for hele landet. Service Health = din by. Resource Health = dit eget vindue."],
["Azure Monitor","<p><b>Azure Monitor</b> indsamler og analyserer metrics og logs fra Azure, on-prem og andre clouds.</p><ul><li><b>Log Analytics:</b> skriv forespørgsler i logdata (med sproget KQL).</li><li><b>Alerts:</b> send besked eller start en handling, når en grænse overskrides.</li><li><b>Application Insights:</b> overvåg performance, forespørgsler og fejl i dine webapps.</li></ul>","Azure Monitor er dit pulsur: det logger alt og bipper, når pulsen bliver for høj."]
],

["Du vil sikre, at ressourcer kun oprettes i EU-regioner. Hvad bruger du?",["Azure Policy","Azure RBAC","Resource lock","Tags"],0,"Azure Policy håndhæver regler for, hvordan ressourcer må oprettes."],

["Du vil se, om DIN specifikke VM er ramt af et problem. Hvad tjekker du?",["Azure status","Resource Health","Pricing calculator","Azure Arc"],1,"Resource Health viser helbredet for en enkelt ressource."],
["Hvilket værktøj giver Bash eller PowerShell direkte i browseren?",["Azure Cloud Shell","Azure Arc","Log Analytics","Azure Advisor"],0,"Cloud Shell kører i browseren, så du skal ikke installere noget."],

["Prismodeller i cloud","<ul><li><b>Pay-as-you-go:</b> betal per time eller sekund, og stop når som helst. Godt, når forbruget er uforudsigeligt.</li><li><b>Reserved Instances:</b> bind dig til en bestemt ressource i 1 eller 3 år, og få stor rabat. Godt til stabile workloads, der kører hele tiden.</li><li><b>Savings plan for compute:</b> forpligt dig til et fast timeforbrug i 1 eller 3 år, men vælg frit mellem compute-services.</li><li><b>Spot VMs:</b> brug Azures ledige kapacitet med stor rabat. Men VM'en kan blive afbrudt, så det passer kun til opgaver, der kan tåle det, fx test og batchjob.</li></ul>","Pay-as-you-go = klippekort. Reserved = årskort. Spot = restplads til halv pris, men du kan blive bedt om at gå."],

["Datacentre og VM-ressourcer","<p>Et <b>Azure-datacenter</b> er en fysisk bygning med servere i racks og egen strøm, køling og netværk. Datacentre samles i availability zones og regioner, og kunder får ikke adgang til dem.</p><p>En virtuel maskine skal bruge flere ressourcer:</p><ul><li><b>Størrelse:</b> antal CPU'er og mængden af RAM.</li><li><b>Image:</b> operativsystemet, fx Windows eller Linux.</li><li><b>Diske:</b> en OS-disk og evt. datadiske (managed disks).</li><li><b>Netværk:</b> et VNet med et subnet og et netværksinterface (NIC). Evt. en offentlig IP.</li><li><b>Network security group (NSG):</b> regler, der tillader eller blokerer trafik.</li></ul>","En VM er som en maskine i fitnesscentret: den skal have strøm (størrelse), et program (OS), et sted at gemme dine sæt (disk) og en plads i salen (netværk)."],

function barbell(kg){let side=Math.max(0,(kg-20)/2);const plates=[];let used=0;
 for(const p of PL){while(side>=p[0]-1e-9){if(used+p[3]+1>92)break;plates.push(p);side-=p[0];used+=p[3]+1;}}
 const W=360,H=110,cy=55;let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Vægtstang med ${fmt(kg)} kg">`;
 s+=`<rect x="4" y="${cy-3}" width="${W-8}" height="6" rx="3" fill="var(--muted)"/>`;
 s+=`<rect x="4" y="${cy-5}" width="102" height="10" rx="3" fill="var(--muted)"/><rect x="${W-106}" y="${cy-5}" width="102" height="10" rx="3" fill="var(--muted)"/>`;
 s+=`<rect x="104" y="${cy-11}" width="7" height="22" rx="2" fill="var(--ink)"/><rect x="${W-111}" y="${cy-11}" width="7" height="22" rx="2" fill="var(--ink)"/>`;
 let xl=103,xr=W-104;
 plates.forEach(([k,c,h,w])=>{xl-=w+1;s+=`<rect x="${xl}" y="${cy-h/2}" width="${w}" height="${h}" rx="2.5" fill="${c}" stroke="rgba(0,0,0,.28)"/>`;s+=`<rect x="${xr+1}" y="${cy-h/2}" width="${w}" height="${h}" rx="2.5" fill="${c}" stroke="rgba(0,0,0,.28)"/>`;xr+=w+1;});
 return s+"</svg>";}

/* quiz + exam */
function startQuiz(d,exam){let pool=[];
 if(exam){[["d1",11],["d2",15],["d3",14]].forEach(([k,n])=>shuffle(D[k].quiz).slice(0,n).forEach(q=>pool.push({q,d:k})));pool=shuffle(pool);}
 else pool=shuffle(D[d].quiz).slice(0,10).map(q=>({q,d}));
 cur={exam,d,list:pool.map(p=>({...p,opts:mkOpts(p.q)})),i:0,right:0,combo:0,wrong:[],end:Date.now()+45*60e3};
 if(exam)timerId=setInterval(tick,1000);question();}
function allQ(){const p=[];["d1","d2","d3"].forEach(k=>D[k].quiz.forEach(q=>p.push({q,d:k})));return p;}
function startMode(m){const all=allQ();let pool;
 if(m==="wod"){const seen=new Set();pool=[];shuffle(all.filter(p=>S.miss[key(p.q)])).concat(shuffle(all.filter(p=>!S.mast[key(p.q)])),shuffle(all)).forEach(p=>{if(pool.length<5&&!seen.has(key(p.q))){seen.add(key(p.q));pool.push(p);}});}
 else if(m==="retry")pool=shuffle(all.filter(p=>S.miss[key(p.q)])).slice(0,10);
 else pool=shuffle(all);
 if(!pool.length){toast("Ingen spørgsmål her lige nu");home();return;}
 cur={mode:m,exam:false,d:null,list:pool.map(p=>({...p,opts:mkOpts(p.q)})),i:0,right:0,combo:0,wrong:[],hp:12,max:12,hearts:3};question();}
function bossBar(){return `<div class="boss"><div class="bname"><span class="drag">🐉</span><div><b>Downtime-Dragen</b><div class="hp"><div style="width:${cur.hp/cur.max*100}%"></div></div><small>${cur.hp} af ${cur.max} HP</small></div></div><div class="hearts" aria-label="${cur.hearts} liv tilbage">${"❤️".repeat(Math.max(0,cur.hearts))}${"🖤".repeat(3-Math.max(0,cur.hearts))}</div></div>`;}
function qColor(){return cur.exam?"var(--ex)":cur.mode?MODEC[cur.mode]:D[cur.d].color;}
function modeFinish(n){const m=cur.mode,c=MODEC[m],answered=cur.right+cur.wrong.length;let big,sub,h;
 if(m==="boss"){const win=cur.hp<=0;if(win){S.boss++;confetti(90);sfx.clang();}else sfx.no();big=win?"🏆":"🐉";sub=`${cur.right} rigtige af ${answered} – dragen har ${cur.hp} HP tilbage`;h=win?"Downtime-Dragen er besejret! Serverne kører igen 🎉":"Dragen vandt denne gang. Genoptræn dine fejl, og kom stærkere tilbage!";}
 else if(m==="wod"){S.wod=today();S.wodCount++;if(cur.right===n){confetti(60);sfx.clang();}big=`${cur.right}/${n}`;sub="Dagens WOD er gennemført – dobbelt kilo på hvert rigtigt svar";h=cur.right===n?"Perfekt WOD! 💪":"WOD klaret! Kom igen i morgen for en ny.";}
 else{const left=Object.keys(S.miss).length;big=`${cur.right}/${n}`;sub=`Fejl tilbage at genoptræne: ${left}`;h=left?"Hver genoptræning gør de svage punkter stærkere.":"Alle fejl er rettet! Stærkt! 🧠";if(!left){confetti(50);sfx.badge();}}
 save();checkBadges();
 const again=m==="boss"?`<button class="btn primary" data-go="boss">Ny boss-kamp</button>`:(m==="retry"&&Object.keys(S.miss).length)?`<button class="btn primary" data-go="retry">Genoptræn igen</button>`:"";
 app.innerHTML=`${topbar(MODEN[m])}<section class="result" style="--c:${c==="var(--d3)"?"var(--ink)":c}"><p class="big cond">${big}</p><p>${sub}</p><h2>${h}</h2></section>${review()}<div class="row"><button class="btn" data-go="home">Tilbage til oversigt</button>${again}</div>`;window.scrollTo(0,0);}
function timeLeft(){const s=Math.max(0,Math.round((cur.end-Date.now())/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function tick(){const t=document.getElementById("timer");if(t)t.textContent=timeLeft();if(Date.now()>=cur.end)finish();}
function question(){view="quiz";const it=cur.list[cur.i],c=qColor(),boss=cur.mode==="boss";cur.answered=false;
 const label=boss?`Runde ${cur.i+1}`:`Spørgsmål ${cur.i+1} af ${cur.list.length}${cur.exam?` <span id="timer" class="timer">${timeLeft()}</span>`:""}`;
 app.innerHTML=`${topbar(label)}${boss?bossBar():prog(cur.i/cur.list.length,c)}
 <div class="qwrap">${(cur.exam||cur.mode)?`<p class="tag">${D[it.d].name}</p>`:""}<h2 class="q">${it.q[0]}</h2>
 <div class="opts">${it.opts.map((o,i)=>`<button class="opt" data-act="answer" data-i="${i}"><span class="let">${"ABCD"[i]}</span><span>${o.t}</span></button>`).join("")}</div>
 <div id="fb" aria-live="polite"></div>
 <div class="row"><button class="btn ghost small" data-act="speakQ">🔊 Læs spørgsmålet op</button></div></div>`;}
function answer(b){if(cur.answered)return;cur.answered=true;stopSpeak();touchDay();
 const it=cur.list[cur.i],o=it.opts[+b.dataset.i],btns=[...app.querySelectorAll(".opt")];
 btns.forEach((x,i)=>{x.disabled=true;if(it.opts[i].ok&&!cur.exam)x.classList.add("right");});
 track(it.q,o.ok);let gain=0;if(o.ok){cur.right++;cur.combo++;S.maxCombo=Math.max(S.maxCombo,cur.combo);gain=cur.mode==="wod"?5:2.5;if(cur.combo%3===0)gain+=2.5;if(!cur.exam){sfx.ok();if(cur.combo>=3&&cur.combo%3===0)confetti(18);}addKg(gain,cur.exam);}else{cur.combo=0;cur.wrong.push({it,picked:o.t});if(!cur.exam)sfx.no();}
 checkBadges();
 if(cur.exam){b.classList.add("picked");setTimeout(()=>{if(view==="quiz"&&cur.exam)nextQ();},300);return;}
 if(!o.ok)b.classList.add("wrong");
 let msg=o.ok?pick(GOOD)+(cur.combo%3===0?` Combo x${cur.combo}! 🔥`:""):pick(BAD),over=cur.i===cur.list.length-1;
 if(cur.mode==="boss"){if(o.ok){const dmg=cur.combo>=3?2:1;cur.hp=Math.max(0,cur.hp-dmg);msg=dmg>1?"Kritisk slag! Dragen mister 2 HP 💥":"Slag! Dragen mister 1 HP ⚔️";}else{cur.hearts--;msg=pick(TAUNT);}
  over=cur.hp<=0||cur.hearts<=0;const bb=app.querySelector(".boss");if(bb){bb.outerHTML=bossBar();const dr=app.querySelector(".drag");if(o.ok&&dr)dr.classList.add("hit");}}
 document.getElementById("fb").innerHTML=`<div class="fb ${o.ok?"ok":"no"}"><p class="fbh">${msg}${o.ok?` <span class="gain">+${fmt(gain)} kg</span>`:""}</p><p>${it.q[3]}</p></div><button class="btn primary wide" data-act="nextQ">${over?"Se resultat":"Næste spørgsmål"}</button>`;}
function nextQ(){cur.i++;if(cur.i>=cur.list.length||(cur.mode==="boss"&&(cur.hp<=0||cur.hearts<=0)))finish();else{question();window.scrollTo(0,0);}}
function review(){const unanswered=cur.list.length-cur.i-(cur.i<cur.list.length&&cur.answered?1:0);
 let h=`<section class="review"><h2>${cur.wrong.length?"Kig på dem her igen":"Ingen fejl – fejlfrit sæt! 🏆"}</h2>`;
 cur.wrong.forEach(w=>{const c=w.it.opts.find(o=>o.ok).t;h+=`<div class="rv"><p class="q2">${w.it.q[0]}</p><p class="you">Du svarede: ${w.picked}</p><p class="corr">Rigtigt svar: ${c}</p><p class="ex">${w.it.q[3]}</p></div>`;});
 if(cur.exam&&unanswered>0)h+=`<p class="meta">${unanswered} spørgsmål nåede du ikke – de tæller som forkerte.</p>`;
 return h+"</section>";}
function finish(){clearInterval(timerId);timerId=null;view="result";const n=cur.list.length,pct=Math.round(cur.right/n*100);
 if(cur.mode){modeFinish(n);return;}
 if(cur.exam){const score=Math.round(cur.right/n*1000),pass=score>=700;S.exam=Math.max(S.exam,score);save();if(pass){confetti(80);sfx.clang();}checkBadges();
  app.innerHTML=`${topbar("Prøveeksamen")}<section class="result" style="--c:var(--ex)"><p class="big cond">${score}</p><p>af 1000 point – der kræves 700 for at bestå</p><h2>${pass?"Bestået! Du nærmer dig eksamensform 🏆":"Ikke helt endnu – men hvert sæt gør dig stærkere 💪"}</h2><p>${cur.right} af ${n} rigtige</p></section>${review()}
  <div class="row"><button class="btn" data-go="home">Tilbage til oversigt</button><button class="btn primary" data-go="exam">Ny prøveeksamen</button></div>`;}
 else{S.best[cur.d]=Math.max(S.best[cur.d],pct);if(pct===100){S.perfect++;confetti(70);sfx.clang();}save();checkBadges();const x=D[cur.d];
  const msg=pct===100?"Fejlfrit sæt! 🏆":pct>=80?"Stærkt løft! Den her station sidder godt.":pct>=60?"God form – kig på fejlene og tag et sæt mere.":"Opvarmningen er i gang. Læs lektionerne igen, og prøv så igen.";
  app.innerHTML=`${topbar(x.name)}<section class="result" style="--c:${x.color==="var(--d3)"?"var(--ink)":x.color}"><p class="big cond">${pct} %</p><p>${cur.right} af ${n} rigtige, stangen vejer nu ${fmt(S.kg)} kg</p><h2>${msg}</h2></section>${review()}
  <div class="row"><button class="btn" data-go="lesson" data-d="${cur.d}">Læs lektionerne</button><button class="btn primary" data-go="quiz" data-d="${cur.d}">Tag et sæt mere</button></div>`;}
 window.scrollTo(0,0);}

/* sprint */
function startSprint(){const pool=[];["d1","d2","d3"].forEach(k=>D[k].quiz.forEach(q=>pool.push({q,d:k})));
 cur={sprint:true,list:shuffle(pool).map(p=>({...p,opts:mkOpts(p.q)})),i:0,right:0,wrong:0,combo:0,end:Date.now()+60000,lock:false};
 timerId=setInterval(sprintTick,200);sprintQ();}
function secsLeft(){return Math.max(0,Math.ceil((cur.end-Date.now())/1000));}
function sprintTick(){const t=document.getElementById("sptime"),s=secsLeft();if(t){t.textContent=s;t.classList.toggle("hot",s<=10);}if(Date.now()>=cur.end)sprintEnd();}
function sprintQ(){view="sprint";if(cur.i>=cur.list.length){cur.list=shuffle(cur.list);cur.i=0;}const it=cur.list[cur.i],s=secsLeft();
 app.innerHTML=`${topbar("Sprint")}<p class="sp-time${s<=10?" hot":""}" id="sptime">${s}</p><p class="sp-score">${cur.right} rigtige${cur.combo>=3?` – combo x${cur.combo} 🔥`:""}${S.sprint?`, rekord ${S.sprint}`:""}</p>
 <div class="qwrap" id="spq"><h2 class="q">${it.q[0]}</h2><div class="opts">${it.opts.map((o,i)=>`<button class="opt" data-act="spAns" data-i="${i}"><span class="let">${"ABCD"[i]}</span><span>${o.t}</span></button>`).join("")}</div></div>`;}
function spAns(b){if(cur.lock||view!=="sprint")return;cur.lock=true;touchDay();const it=cur.list[cur.i],o=it.opts[+b.dataset.i];track(it.q,o.ok);
 if(o.ok){cur.right++;cur.combo++;S.maxCombo=Math.max(S.maxCombo,cur.combo);sfx.ok();b.classList.add("right");addKg(2.5,true);}
 else{cur.wrong++;cur.combo=0;cur.end-=3000;sfx.no();b.classList.add("wrong");document.getElementById("spq").classList.add("shake");app.querySelectorAll(".opt").forEach((x,i)=>{if(it.opts[i].ok)x.classList.add("right")});}
 setTimeout(()=>{if(view!=="sprint")return;cur.lock=false;cur.i++;if(Date.now()<cur.end)sprintQ();else sprintEnd();},o.ok?250:800);}
function sprintEnd(){if(view!=="sprint")return;clearInterval(timerId);timerId=null;view="result";const rec=cur.right>S.sprint;if(rec)S.sprint=cur.right;save();
 if(rec&&cur.right>0){confetti(70);sfx.clang();}checkBadges();
 app.innerHTML=`${topbar("Sprint")}<section class="result" style="--c:var(--d2)"><p class="big cond">${cur.right}</p><p>rigtige på 60 sekunder${cur.wrong?` – ${cur.wrong} forkerte kostede ${cur.wrong*3} sek.`:" – uden en eneste fejl!"}</p><h2>${rec&&cur.right>0?"Ny rekord! ⚡":"Rekorden er "+S.sprint+" – kan du slå den?"}</h2></section>
 <div class="row"><button class="btn" data-go="home">Tilbage til oversigt</button><button class="btn primary" data-go="sprint">Sprint igen</button></div>`;window.scrollTo(0,0);}

function realIntro(){view="realintro";app.innerHTML=`${topbar("Realistisk eksamen")}<section class="lesson" style="--c:var(--ex)"><h2>Realistisk eksamen</h2><div class="body"><p>Bygget som den rigtige eksamen:</p><ul><li><b>40 opgaver på engelsk</b> i samme stil som Microsofts egne, fordelt efter eksamens vægtning.</li><li><b>Fem opgavetyper:</b> ét svar, flere svar, Yes/No-påstande, match og sætninger, der skal fuldføres.</li><li><b>Ingen facit undervejs.</b> Du kan gå frem og tilbage, markere opgaver med 🚩 og se en oversigt, før du afslutter.</li><li><b>Yes/No-opgaver låses 🔒</b>, når du forlader dem – ligesom i den rigtige eksamen.</li><li><b>Delvise point</b> på opgaver med flere dele. Du skal have 700 for at bestå.</li></ul><p>Bagefter får du din score, din præstation per område og forklaringer på dansk.</p></div><label class="auto"><input type="checkbox" id="xtra"> Tilføj 30 minutter (sprogtillæg, fordi eksamen ikke er på dit modersmål)</label></section><div class="row"><button class="btn primary" data-act="realStart">Start eksamen (45 min)</button></div>`;}
function startReal(){const x=document.getElementById("xtra"),extra=!!(x&&x.checked),pk=[];
 [["d1",11],["d2",15],["d3",14]].forEach(([d,n])=>shuffle(REAL.filter(r=>r.d===d)).slice(0,n).forEach(r=>pk.push(r)));
 const items=shuffle(pk).map(r=>{const it={...r};if(r.o)it.ord=shuffle(r.o.map((_,i)=>i));if(r.t==="match"){it.choices=shuffle(r.pairs.map(p=>p[0]).concat(r.extra||[]));it.rows=shuffle(r.pairs.map((_,i)=>i));}return it;});
 cur={real:true,items,ans:items.map(it=>it.t==="multi"?[]:it.t==="yn"?it.s.map(()=>null):it.t==="match"?it.pairs.map(()=>""):null),mark:items.map(()=>false),lock:items.map(()=>false),i:0,end:Date.now()+(extra?75:45)*60e3};
 timerId=setInterval(realTick,1000);realQ();window.scrollTo(0,0);}
function rTime(){const s=Math.max(0,Math.round((cur.end-Date.now())/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function realTick(){const t=document.getElementById("rtime");if(t)t.textContent=rTime();if(Date.now()>=cur.end){toast("Tiden er gået – eksamen afsluttes");realSubmit();}}
function realHead(label){return `<div class="vxhead"><span>AZ-900</span><span>${label}</span><span id="rtime" class="timer">${rTime()}</span></div>`;}
function answered(i){const a=cur.ans[i],it=cur.items[i];if(it.t==="multi")return a.length===it.a.length;if(it.t==="yn")return a.every(v=>v!==null);if(it.t==="match")return a.every(v=>v);return a!==null;}
function realQ(){view="real";const i=cur.i,it=cur.items[i],a=cur.ans[i],L=cur.lock[i],dis=L?"disabled":"";let body=L?`<p class="warn">This question is locked. You can no longer change your answer.</p>`:"";
 if(it.t==="single"||it.t==="multi"){const m=it.t==="multi";body+=`<div class="opts">`+it.ord.map(k=>`<label class="ropt"><input type="${m?"checkbox":"radio"}" name="r" data-rt="${it.t}" value="${k}" ${(m?a.includes(k):a===k)?"checked":""} ${dis}><span>${it.o[k]}</span></label>`).join("")+`</div>`;}
 else if(it.t==="yn"){body+=(L?"":`<p class="warn">Once you leave this question, you will not be able to return to it.</p>`)+`<div class="yn"><div class="ynh"><span>Statements</span><span>Yes</span><span>No</span></div>`+it.s.map((st,k)=>`<div class="ynr"><span>${st[0]}</span>${[true,false].map(v=>`<label class="ync"><input type="radio" name="yn${k}" data-rt="yn" data-k="${k}" value="${v}" ${a[k]===v?"checked":""} ${dis} aria-label="${v?"Yes":"No"}"></label>`).join("")}</div>`).join("")+`</div>`;}
 else if(it.t==="match"){body+=`<div class="mt">`+it.rows.map(k=>`<div class="mtr"><span>${it.pairs[k][1]}</span><select data-rt="match" data-k="${k}" ${dis}><option value="">Select…</option>${it.choices.map(c=>`<option ${a[k]===c?"selected":""}>${c}</option>`).join("")}</select></div>`).join("")+`</div>`;}
 else if(it.t==="dd"){body+=`<p class="ddp">${it.pre} <select data-rt="dd" ${dis}><option value="">Select…</option>${it.ord.map(k=>`<option value="${k}" ${a===k?"selected":""}>${it.o[k]}</option>`).join("")}</select> ${it.post||""}</p>`;}

function realReview(){view="real";const un=cur.items.filter((_,i)=>!answered(i)).length,mk=cur.mark.filter(Boolean).length;

 <div class="row"><button class="btn" data-go="home">Afbryd</button><button class="btn primary" data-act="rSubmit">End exam</button></div>`;window.scrollTo(0,0);}
function itemScore(it,a){if(it.t==="single"||it.t==="dd")return a===it.a?1:0;
 if(it.t==="multi"){const c=a.filter(x=>it.a.includes(x)).length;return Math.max(0,c-(a.length-c))/it.a.length;}
 if(it.t==="yn")return it.s.filter((st,k)=>a[k]===st[1]).length/it.s.length;
 return it.pairs.filter((p,k)=>a[k]===p[0]).length/it.pairs.length;}
function ansText(it,a,right){if(it.t==="single"||it.t==="dd"){const v=right?it.a:a;return v===null?"(ikke besvaret)":it.o[v];}
 if(it.t==="multi"){const v=right?it.a:a;return v.length?v.map(k=>it.o[k]).join(" + "):"(ikke besvaret)";}
 if(it.t==="yn")return it.s.map((st,k)=>{const v=right?st[1]:a[k];return `${st[0]} → ${v===null?"?":v?"Yes":"No"}`;}).join("<br>");
 return it.pairs.map((p,k)=>`${p[1]} → ${right?p[0]:(a[k]||"?")}`).join("<br>");}
function realSubmit(){if(view!=="real")return;clearInterval(timerId);timerId=null;view="result";const per={d1:[0,0],d2:[0,0],d3:[0,0]};let tot=0;
 const sc=cur.items.map((it,i)=>{const s=itemScore(it,cur.ans[i]);per[it.d][0]+=s;per[it.d][1]++;tot+=s;return s;});
 const n=cur.items.length,score=Math.round(tot/n*1000),pass=score>=700;S.real=Math.max(S.real||0,score);touchDay();addKg(Math.round(tot)*2.5,true);save();if(pass){confetti(90);sfx.clang();}else sfx.no();checkBadges();
 const bars=["d1","d2","d3"].map(d=>{const f=per[d][1]?per[d][0]/per[d][1]:0;return `<div class="rrow"><span>${D[d].name}</span><span>${Math.round(f*100)} %</span></div>${prog(f,D[d].color)}`;}).join("");
 const wrong=cur.items.map((it,i)=>({it,i,s:sc[i]})).filter(x=>x.s<1);
 const rv=wrong.map(({it,i,s})=>`<div class="rv"><p class="q2">${i+1}. ${it.t==="dd"?it.pre+" ___ "+(it.post||""):it.q}</p><p class="you"><b>${s>0?"Delvist rigtigt":"Forkert"}.</b> Dit svar:<br>${ansText(it,cur.ans[i],false)}</p><p class="corr">Rigtigt svar:<br>${ansText(it,null,true)}</p><p class="ex">${it.e}</p></div>`).join("");
 app.innerHTML=`${topbar("Realistisk eksamen")}<section class="result" style="--c:${pass?"var(--ok)":"var(--ex)"}"><p class="big cond">${score}</p><p>af 1000 point – der kræves 700 for at bestå</p><h2>${pass?"Bestået! 🎓":"Ikke bestået endnu 💪"}</h2><p>${score>=800?"Du er i eksamensform. Tag Microsofts practice assessment, og book så eksamen!":pass?"Flot! Sigt efter 800+ for at have margin på eksamensdagen.":"Se dine fejl nedenfor, genoptræn de svage områder, og prøv igen."}</p></section>
 <section class="ready"><h2>Din præstation per område</h2><p class="meta">Ligesom scorerapporten fra den rigtige eksamen.</p>${bars}</section>
 <section class="review"><h2>${wrong.length?`Gennemgang af ${wrong.length} opgaver`:"Alt rigtigt – fejlfrit! 🏆"}</h2>${rv}</section>
 <div class="row"><button class="btn" data-go="home">Tilbage til oversigt</button><button class="btn primary" data-go="real">Ny realistisk eksamen</button></div>`;window.scrollTo(0,0);}

 speakQ(){const it=cur.list[cur.i];speak(strip(it.q[0]+" "+it.opts.map((o,i)=>"ABCD"[i]+": "+o.t+".").join(" ")));},
 flip(){cur.flip=!cur.flip;stopSpeak();card();},
 know(){cur.deck.shift();cur.known++;cur.flip=false;card();},
 again(){cur.deck.push(cur.deck.shift());cur.flip=false;card();},
 speakC(){speak(cur.deck[0][0]);},
 spAns(b){spAns(b);},
 closeLvl(b){b.remove();},
 coach(b){coachI=(coachI+1)%COACH.length;b.querySelector('.bub').innerHTML='<span class="who">Coach Kumulus</span>'+COACH[coachI];},
 snd(b){S.sound=!S.sound;save();b.textContent=S.sound?'🔊':'🔇';b.setAttribute('aria-label',S.sound?'Slå lyd fra':'Slå lyd til');if(S.sound)sfx.ok();},
 realStart(){startReal();},
 rPrev(){rLeave();cur.i--;realQ();window.scrollTo(0,0);},
 rNext(){rLeave();if(cur.i<cur.items.length-1){cur.i++;realQ();window.scrollTo(0,0);}else realReview();},
 rReview(){rLeave();realReview();},
 rGo(b){cur.i=+b.dataset.i;realQ();window.scrollTo(0,0);},
 rSubmit(b){if(!b.dataset.armed){b.dataset.armed="1";b.textContent="Tryk igen for at afslutte";return;}realSubmit();},
 openL(b){cur={d:cur.d,i:+b.dataset.i};lesson();window.scrollTo(0,0);},
 term(b){const t=decodeURIComponent(b.dataset.t);for(const d of ["d1","d2","d3"]){const c=D[d].cards.find(c=>c[0]===t);if(c){showSheet(c[0],c[1]);break;}}},
 closeSheet(b){b.remove();},
 fs(b){S.fs=Math.min(23,Math.max(15,(S.fs||17)+(+b.dataset.v)));save();const a=app.querySelector("article.lesson");if(a)a.style.fontSize=S.fs+"px";},
 lq(b){const c=cur.lq;if(!c||c.done)return;c.done=true;const o=c.opts[+b.dataset.i],k=cur.d+"-"+cur.i;track(c.q,o.ok);touchDay();
  app.querySelectorAll(".qc .opt").forEach((e,j)=>{e.disabled=true;if(c.opts[j].ok)e.classList.add("right");});
  if(o.ok){sfx.ok();confetti(24);const first=!S.lq[k];S.lq[k]=1;if(first)addKg(2.5,true);save();}else{b.classList.add("wrong");sfx.no();}
  document.getElementById("lqfb").innerHTML=`<div class="fb ${o.ok?"ok":"no"}"><p class="fbh">${o.ok?"Stjerne til dig! ⭐"+(S.lq[k]?' <span class="gain">+2,5 kg</span>':""):"Tæt på! Kig lige på lektionen igen 👀"}</p><p>${c.q[3]}</p></div>`;checkBadges();},
 reset(b){if(b.dataset.armed){S=FRESH();save();home();}else{b.dataset.armed="1";b.textContent="Tryk igen for at nulstille alt";}}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-go],[data-act]");if(!b||b.disabled)return;
 if(b.dataset.go){go(b.dataset.go,b.dataset.d);return;}const f=actions[b.dataset.act];if(f)f(b);});
document.addEventListener("change",e=>{const rt=e.target.dataset&&e.target.dataset.rt;
 if(rt&&cur.real){const it=cur.items[cur.i];if(rt==="single")cur.ans[cur.i]=+e.target.value;
  else if(rt==="multi"){const v=+e.target.value,arr=cur.ans[cur.i];if(e.target.checked){if(arr.length>=it.a.length){e.target.checked=false;toast(`Vælg højst ${it.a.length} svar`);return;}arr.push(v);}else cur.ans[cur.i]=arr.filter(x=>x!==v);}
  else if(rt==="yn")cur.ans[cur.i][+e.target.dataset.k]=e.target.value==="true";
  else if(rt==="match")cur.ans[cur.i][+e.target.dataset.k]=e.target.value;
  else if(rt==="dd")cur.ans[cur.i]=e.target.value===""?null:+e.target.value;return;}
 if(e.target.id==="rmark"){cur.mark[cur.i]=e.target.checked;return;}
 if(e.target.id==="xtra"){const b=app.querySelector('[data-act="realStart"]');if(b)b.textContent=`Start eksamen (${e.target.checked?75:45} min)`;return;}const sy=e.target.dataset&&e.target.dataset.syl;if(sy){if(e.target.checked)S.syl[sy]=1;else delete S.syl[sy];save();const b=app.querySelector(".lesson b");if(b)b.textContent=`${sylDone()} af ${SYLN}`;const pb=app.querySelector(".lesson .prog div");if(pb)pb.style.width=Math.round(sylDone()/SYLN*100)+"%";if(sylDone()===SYLN){confetti(80);sfx.clang();toast("Hele pensum er på plads! 🎓");}return;}if(e.target.id==="auto"){auto=e.target.checked;if(auto)speakLesson();else stopSpeak();}});
if(synth&&synth.onvoiceschanged!==undefined)synth.onvoiceschanged=()=>{};
home();
</script>
</body>
</html>
